<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SAT Diagnostic – Practice Test</title>
<style>
:root{--navy:#24416b;--navy2:#2f5d9a;--sky:#e9f1fb;--line:#d5dbe5;--ink:#1b2330;--muted:#5c6776;--good:#1f8a4c;--warn:#c0392b;--flag:#d97706;--bg:#f6f8fb}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
.serif{font-family:Georgia,"Noto Serif","Times New Roman",serif}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.btn{background:var(--navy2);color:#fff;border:0;border-radius:999px;padding:.6em 1.4em;font-weight:600;min-height:44px}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy2)}
.btn.big{font-size:1.15em;padding:.75em 2em}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
/* screens */
.screen{min-height:100%;display:flex;flex-direction:column}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(20,40,80,.08);padding:28px 30px;max-width:760px;width:calc(100% - 28px);margin:28px auto}
.hero{text-align:center}
.hero .emoji{font-size:54px;line-height:1}
h1{font-size:1.8em;margin:.2em 0 .3em;color:var(--navy)}
h2{color:var(--navy);margin:.2em 0 .5em}
.kicker{letter-spacing:.18em;text-transform:uppercase;color:var(--navy2);font-size:.8em;font-weight:700}
.field{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0}
.field input{font:inherit;padding:.5em .8em;border:2px solid var(--line);border-radius:10px;width:220px}
table.plan{border-collapse:collapse;margin:10px auto;font-size:.95em}
table.plan td,table.plan th{border-bottom:1px solid var(--line);padding:6px 14px;text-align:left}
ul.tips{padding-left:1.2em} ul.tips li{margin:.3em 0}
/* test layout */
header.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px}
header.bar .title{font-weight:700;color:var(--navy);font-size:.95em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{display:flex;flex-direction:column;align-items:center;min-width:92px}
.timer .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.3em;letter-spacing:.03em}
.timer .t.low{color:var(--warn)}
.timer button{background:none;border:1px solid var(--line);border-radius:999px;font-size:.72em;padding:0 .8em;color:var(--muted)}
.tools{flex:1;display:flex;justify-content:flex-end;gap:6px}
.tool{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.35em .7em;font-size:.85em;color:var(--navy);min-height:40px}
.tool:hover{background:var(--sky)}
main.q{flex:1;display:flex;width:100%;max-width:1200px;margin:0 auto;padding:14px 14px 96px;gap:18px}
.pane{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;flex:1;min-width:0}
.pane.left{flex:1.1}
.qhead{display:flex;align-items:center;justify-content:space-between;background:#eef2f7;border-radius:8px;padding:4px 6px 4px 4px;margin-bottom:12px}
.qnum{background:var(--ink);color:#fff;font-weight:700;border-radius:6px;padding:2px 10px}
.flagbtn{background:none;border:0;color:var(--muted);font-size:.9em;padding:.3em .6em;border-radius:8px;min-height:36px}
.flagbtn.on{color:var(--flag);font-weight:700}
.flagbtn .ic{display:inline-block;width:14px;height:16px;vertical-align:-2px;margin-right:4px}
.passage{font-size:1.02em}
.stem{font-weight:600;margin:4px 0 12px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;min-height:52px;color:var(--ink)}
.choice:hover{border-color:var(--navy2)}
.choice .L{flex:0 0 32px;height:32px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:system-ui,sans-serif}
.choice.sel{border-color:var(--navy2);background:var(--sky);box-shadow:0 0 0 2px var(--navy2) inset}
.choice.sel .L{background:var(--navy2);border-color:var(--navy2);color:#fff}
.fig{text-align:center;margin:6px 0 12px} .fig img{max-width:100%;width:440px;height:auto}
.shortt{display:none}
.fig.small img{width:360px}
ul.notes{margin:6px 0 10px;padding-left:1.3em} ul.notes li{margin:.25em 0}
.eq{margin:4px 0 10px 18px;font-size:1.08em;line-height:1.6}
.frac{display:inline-block;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.15;margin:0 2px}
.frac .num{display:block;border-bottom:1px solid currentColor;padding:0 3px}.frac .den{display:block;padding:0 3px}
sup{font-size:.7em;line-height:0}
table.data{border-collapse:collapse;margin:8px auto 12px;font-size:.92em}
table.data th,table.data td{border:1px solid #777;padding:4px 12px;text-align:center}
table.data th{background:#eaf0f8} table.data caption{font-weight:700;margin-bottom:4px}
table.grid{border-collapse:collapse;width:100%;font-size:.9em}
table.grid th,table.grid td{border:1px solid #bbb;padding:6px 8px;vertical-align:top;text-align:left}
table.grid th{background:#eaf0f8}
.small{font-size:.88em;color:var(--muted)}
/* grid-in */
.spr{margin-top:10px}
.spr label{font-weight:600;display:block;margin-bottom:6px}
.spr input{font:inherit;font-size:1.4em;width:170px;padding:.3em .5em;border:2px solid var(--ink);border-radius:8px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.spr .preview{margin-top:10px;font-size:1.1em}
.spr .err{color:var(--warn);font-size:.9em;margin-top:6px;min-height:1.2em}
.sprhelp{margin-top:16px;background:#f5f7fa;border-radius:10px;padding:10px 14px;font-size:.86em;color:var(--muted)}
.sprhelp ul{margin:4px 0;padding-left:1.2em}
/* footer */
footer.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
footer.nav .who{flex:1;font-weight:600;color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer.nav .mid{flex:0 0 auto}
footer.nav .right{flex:1;display:flex;justify-content:flex-end;gap:8px}
.navbtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:.45em 1em;font-weight:600;min-height:40px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .box h3{margin:0 0 10px;color:var(--navy)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:12px 0}
.navgrid button{position:relative;height:46px;border:2px dashed #8a94a3;background:#fff;border-radius:8px;font-weight:700;color:var(--navy)}
.navgrid button.ans{border:2px solid var(--navy2);background:var(--navy2);color:#fff}
.navgrid button.cur{outline:3px solid var(--ink);outline-offset:2px}
.navgrid button.flg::after{content:"";position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--flag);border:2px solid #fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82em;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .a::before{background:var(--navy2)} .legend .u::before{border:2px dashed #8a94a3} .legend .f::before{background:var(--flag);border-radius:50%}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
/* calculator */
#calc{position:fixed;right:14px;bottom:78px;z-index:15;width:290px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:12px}
#calc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--navy)}
#calc input{width:100%;font-size:1.25em;text-align:right;padding:.35em .5em;border:2px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
#calc .res{text-align:right;color:var(--muted);min-height:1.4em;font-size:.95em;margin:4px 2px}
#calc .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#calc .keys button{height:42px;border:1px solid var(--line);border-radius:8px;background:#f5f7fa;font-weight:600}
#calc .keys button.op{background:#e9f1fb;color:var(--navy)}
#calc .keys button.eq{background:var(--navy2);color:#fff;grid-column:span 2}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:30;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* review & done */
.revgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:14px 0}
.revgrid button{height:52px;border:2px dashed #8a94a3;background:#fff;border-radius:8px;font-weight:700;color:var(--navy);position:relative}
.revgrid button.ans{border:2px solid var(--navy2);background:var(--navy2);color:#fff}
.revgrid button.flg::after{content:"";position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--flag);border:2px solid #fff}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.stat{background:var(--sky);border-radius:12px;padding:10px 16px;text-align:center;min-width:140px}
.stat b{display:block;font-size:1.3em;color:var(--navy)}
.resp{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:8px 0 16px}
.resp div{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.9em;background:#fff}
.resp div b{color:var(--navy)} .resp div.blank{color:#9aa3af} .resp div.fl{border-color:var(--flag);background:#fff7ea}
.send{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
.send a.btn{text-decoration:none;display:inline-flex;align-items:center}
textarea.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8em;border:1px solid var(--line);border-radius:8px;padding:8px;height:92px;resize:vertical}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85em}
@media (max-width:820px){
  main.q{flex-direction:column;padding:10px 10px 96px;gap:10px}
  .pane{padding:14px 14px}
  body{font-size:16px}
  .tool .lbl{display:none}
  header.bar .title{font-size:.85em}
  #calc{left:10px;right:10px;width:auto}
  footer.nav .who{display:none}
  header.bar .long{display:none} header.bar .shortt{display:inline}
  footer.nav{justify-content:space-between}
}
</style>
</head>
<body>
<div id="app"></div>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>

<div id="calc" class="hidden" role="dialog" aria-label="Calculator">
  <div class="top"><span>Calculator</span><button class="tool" onclick="toggleCalc(false)">Close ✕</button></div>
  <input id="calcIn" inputmode="decimal" autocomplete="off" placeholder="e.g. 2*(3+4)">
  <div class="res" id="calcRes"></div>
  <div class="keys" id="calcKeys"></div>
</div>

<template id="refTpl">
<div>
<table class='grid' style='font-size:9.5pt'>
<tr><th>Shape / fact</th><th>Formula</th><th>Shape / fact</th><th>Formula</th></tr>

<tr><td>Rectangle</td><td><i>A</i> = <i>ℓw</i></td><td>Cylinder</td><td><i>V</i> = π<i>r</i><sup>2</sup><i>h</i></td></tr>
<tr><td>Triangle</td><td><i>A</i> = ½<i>bh</i></td><td>Sphere</td><td><i>V</i> = <span class='frac'><span class='num'>4</span><span class='den'>3</span></span>π<i>r</i><sup>3</sup></td></tr>
<tr><td>Right triangle (Pythagoras)</td><td><i>c</i><sup>2</sup> = <i>a</i><sup>2</sup> + <i>b</i><sup>2</sup> (<i>c</i> = hypotenuse)</td><td>Cone</td><td><i>V</i> = <span class='frac'><span class='num'>1</span><span class='den'>3</span></span>π<i>r</i><sup>2</sup><i>h</i></td></tr>
<tr><td>Special right triangles</td><td>30°–60°–90°: sides <i>x</i>, <i>x</i>√3, 2<i>x</i><br>45°–45°–90°: sides <i>s</i>, <i>s</i>, <i>s</i>√2</td><td>Pyramid (rectangular base)</td><td><i>V</i> = <span class='frac'><span class='num'>1</span><span class='den'>3</span></span><i>ℓwh</i></td></tr>
</table>
<p class='small' style='margin:5pt 0 0'>The number of degrees of arc in a circle is 360. The number of radians of arc in a circle is 2π. The sum of the measures in degrees of the angles of a triangle is 180.</p></div></template>

<script>
"use strict";
const DATA = {"rw": [{"n": 1, "passage": "The bakery on Hollis Street is famous for its egg tarts. Every morning, a line of customers forms before the doors open, and by noon the trays are usually empty. The owner says the tarts are so ______ that some people buy a dozen at a time.", "notes": null, "table": null, "img": null, "stem": "Choose the word or phrase that completes the text with the most logical and precise meaning.", "choices": ["expensive", "hidden", "popular", "fragile"]}, {"n": 2, "passage": "Marine biologist Dr. Lena Ortiz spent six months recording the songs of humpback whales near Tonga. She found that the songs were not random; instead, they followed a ______ pattern, with the same phrases repeating in the same order.", "notes": null, "table": null, "img": null, "stem": "Choose the word or phrase that completes the text with the most logical and precise meaning.", "choices": ["careless", "temporary", "silent", "predictable"]}, {"n": 3, "passage": "Many people think of deserts as empty places, but the Sonoran Desert in North America is home to more than 2,000 kinds of plants. Some, like the saguaro cactus, store water in their thick stems. Others, such as desert wildflowers, stay hidden as seeds for years and bloom only after heavy rain. These strategies allow a surprising variety of life to thrive in a dry environment.", "notes": null, "table": null, "img": null, "stem": "Which choice best states the main idea of the text?", "choices": ["The Sonoran Desert receives heavy rain every year.", "Plants in the Sonoran Desert survive in different ways, which allows many kinds of plants to live there.", "The saguaro cactus is the most important plant in the Sonoran Desert.", "Deserts are empty places where few living things can survive."]}, {"n": 4, "passage": "Priya’s grandmother is known in her neighbourhood for her cooking. Last summer, Priya visited her grandmother in ______ spent two weeks learning to cook traditional Gujarati dishes.", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["Mumbai. She", "Mumbai, she", "Mumbai she", "Mumbai, and, she"]}, {"n": 5, "passage": "Historians often visit the city library to study how the coastline has changed. The collection of old maps in the library ______ detailed drawings of Hong Kong harbour from the 1800s.", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["include", "are including", "includes", "have included"]}, {"n": 6, "passage": "Unlike fish or crabs, octopuses have no bones or hard shells. ______ they can squeeze their soft bodies through openings barely larger than their eyes.", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text with the most logical transition?", "choices": ["However,", "As a result,", "For example,", "In contrast,"]}, {"n": 7, "passage": "Every autumn, monarch butterflies travel up to 4,800 kilometres from Canada and the United States to forests in central Mexico. Scientists have discovered that the butterflies use the position of the sun, along with an internal “clock,” to keep flying in the right direction.", "notes": null, "table": null, "img": null, "stem": "Which choice best describes the main purpose of the text?", "choices": ["To describe the forests of central Mexico in detail", "To argue that monarch butterflies should be better protected", "To compare monarch butterflies with other migrating insects", "To explain how monarch butterflies find their way during a long journey"]}, {"n": 8, "passage": "When the Eiffel Tower was finished in 1889, many Parisian artists signed a letter complaining that it was ugly. The tower was meant to stand for only 20 years. However, it proved useful as a radio antenna, so the city decided to keep it. Today it is one of the most visited monuments in the world.", "notes": null, "table": null, "img": null, "stem": "According to the text, why did the city of Paris decide to keep the Eiffel Tower?", "choices": ["Artists asked the city to keep it.", "It was useful as a radio antenna.", "It was the tallest building in the world.", "Tourists paid to climb it."]}, {"n": 9, "passage": "The Apollo 11 mission is remembered as one of the greatest achievements in history. In 1969, astronauts Neil Armstrong and Buzz Aldrin ______ on the Moon while Michael Collins orbited overhead in the command module.", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["walked", "will walk", "walk", "are walking"]}, {"n": 10, "passage": "Although the novelist’s early books sold poorly, she refused to ______ her distinctive style to match popular trends. Critics who once dismissed her work now praise it as ahead of its time.", "notes": null, "table": null, "img": null, "stem": "Choose the word or phrase that completes the text with the most logical and precise meaning.", "choices": ["discover", "celebrate", "explain", "abandon"]}, {"n": 11, "passage": "Sea otters are sometimes called a “keystone species.” When otter numbers fell sharply in the 1800s because of hunting, sea urchins—the otters’ favourite food—multiplied rapidly. The urchins ate huge amounts of kelp, destroying underwater forests that sheltered many fish. After otters were protected, their numbers recovered, urchin populations shrank, and the kelp forests grew back.", "notes": null, "table": null, "img": null, "stem": "Which choice best describes the overall structure of the text?", "choices": ["It tells the life story of one particular sea otter from birth to old age.", "It describes a problem and then argues against a proposed solution.", "It compares two scientific theories about why kelp forests disappear.", "It introduces a term and then describes a chain of causes and effects that shows why the term applies to sea otters."]}, {"n": 12, "passage": "Student researcher Kai Wong has noticed that many of his classmates who play in the school orchestra seem to pay close attention to small differences in sound. Based on this, Kai claims that learning a musical instrument may help young children develop stronger listening skills.", "notes": null, "table": null, "img": null, "stem": "Which finding, if true, would most directly support Kai’s claim?", "choices": ["Children who took weekly music lessons for a year were better at picking out spoken words in a noisy room than similar children who did not take lessons.", "Children who took music lessons said that they enjoyed school more than they had before.", "Many music teachers also teach foreign languages.", "Children who listened to recorded music while doing homework finished it faster."]}, {"n": 13, "passage": "A student is writing about which kinds of books are most popular at the Harbourview School library. She notes that fiction was by far the most borrowed type of book in 2025, ______", "notes": null, "table": "<table class='data'><caption>Books Borrowed from Harbourview School Library, 2025<\/caption><tr><th>Type of book<\/th><th>Number of loans<\/th><\/tr><tr><td>Fiction<\/td><td>1,240<\/td><\/tr><tr><td>Science<\/td><td>610<\/td><\/tr><tr><td>History<\/td><td>450<\/td><\/tr><tr><td>Poetry<\/td><td>180<\/td><\/tr><\/table>", "img": null, "stem": "Which choice most effectively uses data from the table to complete the statement?", "choices": ["with more than twice as many loans as science books.", "with fewer loans than history and poetry books combined.", "with about the same number of loans as science books.", "while poetry was the second most borrowed type of book."]}, {"n": 14, "passage": "The robotics club spent the whole term designing a machine that could pick up small objects. When the members of the club finished building ______ robot, they tested it on an obstacle course in the school hall.", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["its", "it’s", "his or her", "their"]}, {"n": 15, "passage": "Kites were used in ancient China for more than play. Some military leaders flew them to send signals across battlefields ______ others used them to measure the distance to enemy camps.", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["battlefields,", "battlefields;", "battlefields", "battlefields and,"]}, {"n": 16, "passage": "Early bicycles called “penny-farthings” had a huge front wheel and a tiny rear wheel. Riders sat high above the ground, which made falls dangerous. ______ by the 1890s most riders had switched to the “safety bicycle,” which had two wheels of equal size and a chain drive.", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text with the most logical transition?", "choices": ["Nevertheless,", "For example,", "Consequently,", "Similarly,"]}, {"n": 17, "passage": "While researching a topic, a student has taken the following notes:", "notes": ["The Great Wall of China is a series of walls built over many centuries.", "Including all its branches, its total length is about 21,000 kilometres.", "Much of the best-known section was built during the Ming dynasty (1368–1644).", "The wall was built mainly to protect against invasions from the north."], "table": null, "img": null, "stem": "The student wants to emphasise the purpose of the Great Wall. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": ["The Great Wall, which is about 21,000 kilometres long, is a series of walls.", "The Great Wall of China was built mainly to protect against invasions from the north.", "Much of the best-known section of the Great Wall was built during the Ming dynasty (1368–1644).", "Including all its branches, the Great Wall measures about 21,000 kilometres."]}, {"n": 18, "passage": "In a study, researchers placed identical bird feeders filled with the same seeds in two gardens. Garden A had several thick bushes and trees nearby, while Garden B was in an open field with no plants taller than grass. Over one month, small birds visited the feeder in Garden A more than three times as often as the feeder in Garden B. The researchers concluded that small birds probably prefer feeders that ______", "notes": null, "table": null, "img": null, "stem": "Which choice most logically completes the text?", "choices": ["are painted in bright colours.", "offer more food than other feeders.", "are close to places where the birds can quickly hide from predators.", "are placed in open areas where the birds can see far in every direction."]}, {"n": 19, "passage": "The historian’s account of the long trade dispute is admirably ______: rather than blaming either merchant, she presents the evidence for both sides and lets readers draw their own conclusions.", "notes": null, "table": null, "img": null, "stem": "Choose the word or phrase that completes the text with the most logical and precise meaning.", "choices": ["partisan", "sentimental", "evenhanded", "cursory"]}, {"n": 20, "passage": "<b>Text 1<\/b><br>Some educators argue that homework in primary school does little to improve learning. They point to studies showing that, for younger children, time spent on homework has only a weak link to test scores, and they suggest that play and reading for pleasure may be more valuable.<br><br><b>Text 2<\/b><br>Researcher Amara Blake agrees that homework for young children rarely raises test scores in the short term. However, she argues that small amounts of homework can build habits—such as planning time and working independently—that pay off in secondary school, even if these benefits do not show up in early test results.", "notes": null, "table": null, "img": null, "stem": "Based on the texts, how would Blake (Text 2) most likely respond to the educators in Text 1?", "choices": ["She would reject their claim that homework has only a weak link to test scores for young children.", "She would accept their evidence but argue that it overlooks longer-term benefits of homework.", "She would agree that play is always more valuable than homework.", "She would argue that homework should be removed from secondary school."]}, {"n": 21, "passage": "The following text is from a short story.<br><br>Mei had practised the piano piece for weeks, and she could play it perfectly in her bedroom. <u>But when she walked onto the stage and saw the rows of faces, her fingers felt as if they belonged to someone else.<\/u> She took a slow breath, fixed her eyes on the first line of music, and began.", "notes": null, "table": null, "img": null, "stem": "Which choice best describes the function of the underlined sentence in the text as a whole?", "choices": ["It shows a sudden change in how confident Mei feels.", "It explains why Mei chose to learn this particular piece.", "It describes how the audience reacted to Mei’s performance.", "It reveals that Mei had not practised the piece enough."]}, {"n": 22, "passage": "A student surveyed classmates about screen time and made the graph above. The student claims that for every year group shown, average weekend screen time was at least 1.5 hours greater than average weekday screen time.", "notes": null, "table": null, "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAABDgAAAKoCAYAAACSpk/2AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAewgAAHsIBbtB1PgAAuyRJREFUeJzs3XdYFFfbBvB76VVQiopgAVRiA3uLIvbee4kt9pqosSUm9hpjS4waW+y9B7vYFXvBCgqCIFV6h/n+4GPeXVlggYXdxft3XVzO7pxz5pl1B3aePUUiCIIAIiIiIiIiIiINpqXqAIiIiIiIiIiICooJDiIiIiIiIiLSeExwEBEREREREZHGY4KDiIiIiIiIiDQeExxEREREREREpPGY4CAiIiIiIiIijccEBxERERERERFpPCY4iIiIiIiIiEjjMcFBRERE veraged 2.0 hours on weekdays and 3.5 hours on weekends."]}, {"n": 23, "passage": "Archaeologists studying a Bronze Age village found large numbers of fish bones in the oldest layers of soil but very few in the more recent layers. In the recent layers they instead found many sheep and goat bones, along with tools for spinning wool. The archaeologists also noted that a nearby lake had slowly filled with mud and sediment over the same period. Taken together, these findings suggest that the villagers ______", "notes": null, "table": null, "img": null, "stem": "Which choice most logically completes the text?", "choices": ["stopped eating meat of any kind.", "gradually shifted from relying on fishing toward raising animals, possibly as the lake became less useful.", "moved away from the lake to a new village by the sea.", "had always depended mainly on sheep and goats for food."]}, {"n": 24, "passage": "Rivers have shaped the growth of many ancient civilisations, including Egypt. Stretching more than 6,600 kilometres from the highlands of East Africa to the Mediterranean Sea, ______", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["the Nile’s great length has made it famous around the world.", "scientists have long debated whether the Nile is the longest river on Earth.", "the Nile River has long been considered the longest river on Earth, although some scientists argue that the Amazon is longer.", "the length of the Nile is debated by some scientists."]}, {"n": 25, "passage": "The coelacanth—a deep-sea fish with thick, limb-like ______ surprised scientists in 1938 because it was thought to have died out about 66 million years earlier.", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text so that it conforms to the conventions of Standard English?", "choices": ["fins—", "fins,", "fins", "fins;"]}, {"n": 26, "passage": "For decades, many researchers assumed that the giant stone statues of Rapa Nui (Easter Island) were moved by rolling them on logs, a method that would have required cutting down large numbers of trees. ______ experiments in 2012 showed that a small team pulling on ropes could “walk” an upright statue forward by rocking it from side to side, which matches local traditions saying that the statues walked.", "notes": null, "table": null, "img": null, "stem": "Which choice completes the text with the most logical transition?", "choices": ["Indeed,", "Similarly,", "For this reason,", "However,"]}, {"n": 27, "passage": "While researching a topic, a student has taken the following notes:", "notes": ["Ada Lovelace (1815–1852) was an English mathematician.", "In 1843 she published notes about the Analytical Engine, a mechanical computer designed by Charles Babbage.", "Her notes included a step-by-step method for the machine to calculate a series of numbers called Bernoulli numbers.", "Many historians consider this method the first published computer program.", "The Analytical Engine was never fully built."], "table": null, "img": null, "stem": "The student wants to emphasise the importance of Lovelace’s work to an audience unfamiliar with her. Which choice most effectively uses relevant information from the notes to accomplish this goal?", "choices": ["In 1843, English mathematician Ada Lovelace published a step-by-step method for a mechanical computer to calculate Bernoulli numbers—a method many historians consider the first published computer program.", "The Analytical Engine, a mechanical computer designed by Charles Babbage, was never fully built.", "Ada Lovelace published notes in 1843 that included a step-by-step method for calculating Bernoulli numbers.", "Many historians consider Lovelace’s method the first published computer program, though the Analytical Engine was never fully built."]}], "m": [{"n": 1, "type": "MC", "q": "If 3<i>x<\/i> + 7 = 22, what is the value of <i>x<\/i> const KEY = "alexaSatDiag_v1";
const MOD = {
  rw:{title:"Module 1: Reading and Writing", short:"Reading & Writing", limit:32*60, items:DATA.rw},
  m:{title:"Module 2: Maths", short:"Maths", limit:35*60, items:DATA.m}
};
const BREAK = 10*60;
const EMAILS = "Doris.s.chiu@gmail.com,francoisdemange@hotmail.com";
let S = null, tickTimer = null, warned = {};

function fresh(){ return {v:1,name:"Alexa",phase:"start",idx:0,ans:{rw:{},m:{}},flags:{rw:{},m:{}},
  rwStart:null,rwDeadline:null,rwUsed:null,breakDeadline:null,mStart:null,mDeadline:null,mUsed:null,finishedAt:null,autoEnded:{}}; }
function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s && s.v===1) return s; }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const $ = (id)=>document.getElementById(id);
const esc = (t)=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function fmt(sec){ sec=Math.max(0,Math.ceil(sec)); const m=Math.floor(sec/60), s=sec%60; return m+":"+String(s).padStart(2,"0"); }
function cleanName(n){ return (n||"").replace(/[^A-Za-z \-']/g,"").trim().slice(0,24) || "Student"; }
function toast(msg, ms){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), ms||3500); }

/* ---------- modal helpers ---------- */
function openModal(html){ $("modalBox").innerHTML=html; $("modal").classList.remove("hidden"); }
function closeModal(){ $("modal").classList.add("hidden"); $("modalBox").innerHTML=""; }
$("modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
function confirmBox(title, text, okLabel, onOk, cancelLabel){
  openModal(`<h3>${title}</h3><p>${text}</p><div class="row"><button class="btn ghost" id="mCancel">${cancelLabel||"Go back"}</button><button class="btn" id="mOk">${okLabel}</button></div>`);
  $("mCancel").onclick=closeModal; $("mOk").onclick=()=>{ closeModal(); onOk(); };
}

/* ---------- phases ---------- */
function startRW(){
  S.name = cleanName($("nameIn").value);
  S.phase="rw"; S.idx=0; S.rwStart=Date.now(); S.rwDeadline=S.rwStart+MOD.rw.limit*1000; save(); render();
}
function endModule(mod, auto){
  const now=Date.now();
  if(mod==="rw"){
    S.rwUsed=Math.min(MOD.rw.limit, Math.round((Math.min(now,S.rwDeadline)-S.rwStart)/1000));
    S.autoEnded.rw=!!auto; S.phase="break"; S.breakDeadline=now+BREAK*1000; S.idx=0;
  } else {
    S.mUsed=Math.min(MOD.m.limit, Math.round((Math.min(now,S.mDeadline)-S.mStart)/1000));
    S.autoEnded.m=!!auto; S.phase="done"; S.finishedAt=now;
  }
  closeModal(); toggleCalc(false); save(); render();
  if(auto) toast("Time is up for "+MOD[mod].short+"! Your answers have been saved.", 5000);
}
function startM(){ S.phase="m"; S.idx=0; S.mStart=Date.now(); S.mDeadline=S.mStart+MOD.m.limit*1000; save(); render(); }

/* ---------- timer ---------- */
function tick(){
  const now=Date.now();
  if(S.phase==="rw"||S.phase==="m"){
    const dl = S.phase==="rw"?S.rwDeadline:S.mDeadline; const left=(dl-now)/1000;
    const el=$("timeLeft"); if(el){ el.textContent=fmt(left); el.classList.toggle("low", left<=300); }
    if(left<=300 && left>0 && !warned[S.phase]){ warned[S.phase]=true; toast("5 minutes left in this module"); }
    if(left<=0) endModule(S.phase, true);
  } else if(S.phase==="break"){
    const left=(S.breakDeadline-now)/1000; const el=$("breakLeft");
    if(el){ el.textContent=fmt(left); if(left<=0){ $("breakMsg").textContent="Break is over. Start Maths when you are ready."; } }
  }
}
function ensureTick(){ if(!tickTimer) tickTimer=setInterval(tick,250); }

/* ---------- rendering ---------- */
function render(){
  const app=$("app"); window.scrollTo(0,0);
  if(S.phase==="start") app.innerHTML=startHTML();
  else if(S.phase==="rw"||S.phase==="m") { app.innerHTML=testHTML(); bindTest(); }
  else if(S.phase==="break") app.innerHTML=breakHTML();
  else if(S.phase==="done") { app.innerHTML=doneHTML(); bindDone(); }
  tick();
}

  return `<div class="screen"><div class="card hero">

  <tr><td>Reading &amp; Writing</td><td>27</td><td>32 minutes</td></tr>

  <div style="text-align:left"><ul class="tips">
  <li>Each part has a <b>countdown timer</b>. When time runs out, that part ends automatically and your answers are kept.</li>
  <li>Use <b>Back</b> and <b>Next</b>, or tap the <b>Question</b> button at the bottom to jump around.</li>
  <li><b>Mark for review</b> any question you want to come back to.</li>
  <li>There's no penalty for guessing – try to answer every question.</li>
  <li>In Maths you can open the <b>Reference</b> sheet (formulas) and a <b>Calculator</b>. You can also use your own calculator.</li>
  <li>Your answers are saved on this device as you go, so if the page reloads you won't lose them.</li>
  </ul></div>
  <button class="btn big" id="startBtn" onclick="startRW()">Start Reading &amp; Writing</button>
  <p class="small" style="margin-top:18px">You won't see a score at the end – your answers go to Mum for marking.</p>
  </div></div>`;
}
function flagIcon(){ return `<svg class="ic" viewBox="0 0 14 16"><path d="M2 1v14M2 1h9l-2 3.5L11 8H2" fill="${'currentColor'}" stroke="currentColor" stroke-width="1.6" fill-opacity=".25"/></svg>`; }
function testHTML(){
  const mod=S.phase, M_=MOD[mod], items=M_.items, n=items.length;
  const onReview = S.idx>=n;
  let body="";
  if(onReview) body=reviewHTML(mod);
  else body = mod==="rw" ? rwQHTML(items[S.idx]) : mQHTML(items[S.idx]);
  const tools = mod==="m" ? `<button class="tool" onclick="showRef()">📐 <span class="lbl">Reference</span></button><button class="tool" onclick="toggleCalc()">🧮 <span class="lbl">Calculator</span></button>` : "";
  const qLabel = onReview ? "Review" : `Question ${S.idx+1} of ${n}`;
  return `<div class="screen">
  <header class="bar"><div class="title"><span class="long">${M_.title}</span><span class="shortt">${M_.short}</span></div>
   <div class="timer"><span class="t" id="timeLeft">--:--</span><button onclick="toggleTimer(this)">Hide</button></div>
   <div class="tools">${tools}</div></header>
  ${body}
  <footer class="nav"><div class="who">${esc(S.name)}</div>
   <div class="mid"><button class="navbtn" id="navOpen" onclick="showNav()">${qLabel} ▴</button></div>
   <div class="right"><button class="navbtn" id="backBtn" ${S.idx===0?"disabled style='opacity:.4'":""} onclick="go(-1)">Back</button>
   ${onReview?`<button class="navbtn" style="background:var(--good)" id="finishBtn" onclick="finishEarly()">Finish</button>`:`<button class="navbtn" id="nextBtn" onclick="go(1)">Next</button>`}</div></footer></div>`;
}
function qhead(mod,n){
  const on=!!S.flags[mod][n];
  return `<div class="qhead"><span class="qnum">${n}</span><button class="flagbtn ${on?"on":""}" id="flagBtn" onclick="toggleFlag()">${flagIcon()}${on?"Marked for review":"Mark for review"}</button></div>`;
}
function choicesHTML(mod,q){
  const cur=S.ans[mod][q.n];
  return q.choices.map((c,i)=>{ const L="ABCD"[i];
    return `<button class="choice ${cur===L?"sel":""}" data-l="${L}" aria-pressed="${cur===L}"><span class="L">${L}</span><span class="serif">${c}</span></button>`; }).join("");
}
function rwQHTML(q){
  let left="";
  if(q.table) left+=q.table;
  if(q.img) left+=`<div class="fig"><img src="${q.img}" alt="Graph for question ${q.n}"></div>`;
  left+=`<div class="passage serif">${q.passage}</div>`;
  if(q.notes) left+=`<ul class="notes serif">${q.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`;
  return `<main class="q"><section class="pane left">${left}</section>
  <section class="pane">${qhead("rw",q.n)}<div class="stem serif">${q.stem}</div>${choicesHTML("rw",q)}</section></main>`;
}
function mQHTML(q){
  let h=qhead("m",q.n);
  if(q.table) h+=q.table;
  if(q.img) h+=`<div class="fig ${q.n===11?"small":""}"><img src="${q.img}" alt="Figure for question ${q.n}"></div>`;
  h+=`<div class="passage serif" style="margin-bottom:14px">${q.q}</div>`;
  if(q.type==="MC") h+=choicesHTML("m",q);
  else {
    const v=S.ans.m[q.n]||"";
    h+=`<div class="spr"><label for="sprIn">Your answer:</label><input id="sprIn" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="6" value="${esc(v)}" aria-describedby="sprErr">
    <div class="preview">Answer preview: <b id="sprPrev"></b></div><div class="err" id="sprErr"></div></div>
    <div class="sprhelp"><b>How to enter your answer</b><ul><li>Type a whole number, decimal or fraction, e.g. <b>12</b>, <b>3.5</b>, <b>7/2</b> or <b>-4</b>.</li>
    <li>Up to 5 characters (6 if it starts with a minus sign). If a fraction doesn't fit, use a decimal.</li>
    <li>Don't use mixed numbers (write 3½ as 7/2 or 3.5), and don't type units or symbols like °, $ or %.</li></ul></div>`;
  }
  return `<main class="q" style="max-width:860px"><section class="pane">${h}</section></main>`;
}
function reviewHTML(mod){
  const items=MOD[mod].items;
  const answered=items.filter(q=>S.ans[mod][q.n]).length;
  const btns=items.map((q,i)=>`<button class="${S.ans[mod][q.n]?"ans":""} ${S.flags[mod][q.n]?"flg":""}" onclick="jump(${i})">${q.n}</button>`).join("");
  return `<main class="q" style="max-width:860px"><section class="pane"><h2>Check your work</h2>
  <p>You have answered <b>${answered} of ${items.length}</b> questions. Tap a number to go back to that question. When you're ready, press <b>Finish</b>.</p>
  <div class="legend"><span class="a">Answered</span><span class="u">Not answered</span><span class="f">Marked for review</span></div>
  <div class="revgrid">${btns}</div>
  <p class="small">You can keep checking until the timer runs out.</p></section></main>`;
}
function bindTest(){
  document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{
    const mod=S.phase, q=MOD[mod].items[S.idx]; const L=b.dataset.l;
    S.ans[mod][q.n]=L; save();
    document.querySelectorAll(".choice").forEach(x=>{ x.classList.toggle("sel",x.dataset.l===L); x.setAttribute("aria-pressed",x.dataset.l===L); });
  }));
  const inp=$("sprIn"); if(inp){ inp.addEventListener("input",sprInput); sprInput({target:inp, init:true}); }
}
/* grid-in */
function sprValid(v){
  if(!v) return {ok:true, empty:true};
  if(v.length > (v[0]==="-"?6:5)) return {ok:false,msg:"Too many characters (max 5, or 6 with a minus sign)."};
  if(!/^-?(\d+\.?\d*|\.\d+|\d+\/\d+)$/.test(v)) return {ok:false,msg:"Use a number like 12, 3.5, .75, 7/2 or -4."};
  if(/\/0+$/.test(v)) return {ok:false,msg:"You can't divide by zero."};
  return {ok:true};
}
function sprInput(e){
  const inp=e.target; let v=inp.value.replace(/[−–—]/g,"-").replace(/\s+/g,"").replace(/[^0-9.\/\-]/g,"");
  v=v.replace(/(?!^)-/g,""); if(v!==inp.value) inp.value=v;
  const r=sprValid(v), q=MOD.m.items[S.idx];
  $("sprErr").textContent = r.ok?"":r.msg;
  let prev="";
  if(v){ const m=v.match(/^(-?)(\d+)\/(\d+)$/); prev = m ? `${m[1]?"−":""}<span class="frac"><span class="num">${m[2]}</span><span class="den">${m[3]}</span></span>` : esc(v.replace("-","−")); }
  $("sprPrev").innerHTML=prev;
  if(!e.init){ if(v) S.ans.m[q.n]=v; else delete S.ans.m[q.n]; save(); }
}
function go(d){ const n=MOD[S.phase].items.length; S.idx=Math.max(0,Math.min(n,S.idx+d)); save(); render(); }
function jump(i){ closeModal(); S.idx=i; save(); render(); }
function toggleFlag(){ const mod=S.phase, n=MOD[mod].items[S.idx].n; if(S.flags[mod][n]) delete S.flags[mod][n]; else S.flags[mod][n]=true; save(); render(); }
function toggleTimer(b){ const t=$("timeLeft"); const hid=t.style.visibility==="hidden"; t.style.visibility=hid?"visible":"hidden"; b.textContent=hid?"Hide":"Show"; }
function showNav(){
  const mod=S.phase, items=MOD[mod].items;
  const btns=items.map((q,i)=>`<button class="${S.ans[mod][q.n]?"ans":""} ${S.flags[mod][q.n]?"flg":""} ${i===S.idx?"cur":""}" onclick="jump(${i})">${q.n}</button>`).join("");
  openModal(`<h3>${MOD[mod].title} – Questions</h3><div class="legend"><span class="a">Answered</span><span class="u">Not answered</span><span class="f">Marked for review</span></div>
  <div class="navgrid" id="navGrid">${btns}</div><div class="row"><button class="btn ghost" onclick="closeModal()">Close</button><button class="btn" onclick="jump(${items.length})">Go to Review page</button></div>`);
}
function finishEarly(){
  const mod=S.phase, items=MOD[mod].items; const un=items.filter(q=>!S.ans[mod][q.n]).length;
  const left=Math.max(0,((mod==="rw"?S.rwDeadline:S.mDeadline)-Date.now())/1000);
  confirmBox(`Finish ${MOD[mod].short}?`, `You still have <b>${fmt(left)}</b> left${un?` and <b>${un}</b> unanswered question${un>1?"s":""}`:""}. Once you finish, you can't come back to this module.`,
    mod==="rw"?"Yes, finish and go to break":"Yes, finish the test", ()=>endModule(mod,false));
}
function showRef(){ openModal(`<h3>Reference Sheet</h3>${$("refTpl").innerHTML}<div class="row"><button class="btn" onclick="closeModal()">Close</button></div>`); }

/* break */
function breakHTML(){
  return `<div class="screen"><div class="card hero"><div class="emoji">🧃</div><h1>Break time!</h1>
  <p>Great work on Reading &amp; Writing${S.autoEnded.rw?" – time ran out, but all your answers were saved":""}. Stretch, have a drink and rest your eyes.</p>
  <div style="font-size:3em;font-weight:800;font-variant-numeric:tabular-nums;color:var(--navy)" id="breakLeft">10:00</div>
  <p id="breakMsg" class="small">The break is optional – you can start Maths whenever you're ready.</p>
  <p><b>Next: Maths</b> – 22 questions, 35 minutes. You may use a calculator (there's one built in), and there's a formula reference sheet.</p>
  <button class="btn big" id="startMBtn" onclick="startM()">Start Maths</button></div></div>`;
}

/* done */
function codeString(){
  const part=(mod)=>MOD[mod].items.map(q=>q.n+"="+(S.ans[mod][q.n]||"_")).join(",");
  const fl=[]; ["rw","m"].forEach(mod=>MOD[mod].items.forEach(q=>{ if(S.flags[mod][q.n]) fl.push((mod==="rw"?"RW":"M")+q.n); }));
  const d=new Date(S.finishedAt||Date.now()); const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return `SATDIAG1;N=${cleanName(S.name).replace(/\s+/g,"_")};D=${ds};RW:${part("rw")};M:${part("m")};T:RW=${S.rwUsed||0},M=${S.mUsed||0};F:${fl.join(",")||"-"}`;
}
function mailtoHref(){
  const code=codeString();
  const body=`Hi Mum,\n\nI finished the SAT diagnostic!\nReading & Writing: ${fmt(S.rwUsed||0)} used of 32:00\nMaths: ${fmt(S.mUsed||0)} used of 35:00\n\nAnswer code (for marking):\n${code}\n\nLove, ${cleanName(S.name)}`;
  return "mailto:"+EMAILS+"?subject="+encodeURIComponent(cleanName(S.name)+" SAT diagnostic - answers")+"&body="+encodeURIComponent(body);
}
function respGrid(mod){
  return MOD[mod].items.map(q=>{ const a=S.ans[mod][q.n]; const f=S.flags[mod][q.n];
    return `<div class="${a?"":"blank"} ${f?"fl":""}"><b>${q.n}</b> ${a?esc(a.replace("-","−")):"–"}${f?" ⚑":""}</div>`; }).join("");
}
function doneHTML(){
  const cnt=(mod)=>MOD[mod].items.filter(q=>S.ans[mod][q.n]).length;
  const fl=[]; ["rw","m"].forEach(mod=>MOD[mod].items.forEach(q=>{ if(S.flags[mod][q.n]) fl.push((mod==="rw"?"R&W ":"Maths ")+q.n); }));
  return `<div class="screen"><div class="card"><div class="hero"><div class="emoji">🎉</div><h1>Well done, ${esc(cleanName(S.name))}! You finished!</h1>
  <p>That was a long test and you stuck with it. Now send your answers to Mum so she can mark them.</p></div>
  <div class="send"><a class="btn big" id="mailBtn" href="#">📧 Send my answers to Mum</a><button class="btn ghost big" id="copyBtn">📋 Copy answers</button></div>
  <p class="small" style="text-align:center">If the email button doesn't open an email app, press <b>Copy answers</b> and paste them into a message to Mum.</p>
  <div class="stats"><div class="stat">Reading &amp; Writing<b>${cnt("rw")} / 27 answered</b>${fmt(S.rwUsed||0)} of 32:00 used</div>
  <div class="stat">Maths<b>${cnt("m")} / 22 answered</b>${fmt(S.mUsed||0)} of 35:00 used</div>
  <div class="stat">Marked for review<b>${fl.length}</b>${fl.length?esc(fl.join(", ")):"none"}</div></div>
  <h3>Your Reading &amp; Writing answers</h3><div class="resp" id="respRW">${respGrid("rw")}</div>
  <h3>Your Maths answers</h3><div class="resp" id="respM">${respGrid("m")}</div>
  <label class="small" for="codeBox">Answer code (for Mum):</label><textarea class="code" id="codeBox" readonly>${esc(codeString())}</textarea>
  <div style="text-align:center;margin-top:18px"><button class="link" id="resetBtn">Start a new attempt</button></div></div></div>`;
}
function bindDone(){
  $("mailBtn").setAttribute("href", mailtoHref());
  $("copyBtn").onclick=async()=>{
    const txt=codeString(); let ok=false;
    try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){}
    if(!ok){ const ta=$("codeBox"); ta.focus(); ta.select(); try{ ok=document.execCommand("copy"); }catch(e){} }
    toast(ok?"Answers copied! Paste them into a message to Mum.":"Select the answer code below and copy it.");
  };
  $("resetBtn").onclick=()=>confirmBox("Start a new attempt?","This will delete all the answers on this device. Only do this if Mum has already got your answers.","Yes, delete and restart",()=>{ S=fresh(); save(); render(); },"Keep my answers");
}

/* calculator */
const CK=[["7","8","9","÷","("],["4","5","6","×",")"],["1","2","3","−","^"],["0",".","π","+","√"],["C","⌫","±","="]];
function buildCalc(){
  const k=$("calcKeys"); k.innerHTML="";
  CK.flat().forEach(c=>{ const b=document.createElement("button"); b.textContent=c; b.type="button";
    if("÷×−+^√()π±".includes(c)) b.className="op"; if(c==="=") b.className="eq";
    b.onclick=()=>calcKey(c); k.appendChild(b); });
  $("calcIn").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); calcKey("="); } });
}
function calcEval(src){
  let s=src.replace(/×/g,"*").replace(/÷/g,"/").replace(/[−–]/g,"-").replace(/π/g,"PI").replace(/√/g,"sqrt").replace(/\^/g,"**").replace(/\s+/g,"");
  s=s.replace(/(\d|\)|PI)(?=\(|PI|sqrt)/g,"$1*");
  s=s.replace(/sqrt(\d+(?:\.\d+)?|PI)/g,"sqrt($1)");
  if(!/^[0-9.+\-*/()]*$/.test(s.replace(/sqrt|PI/g,""))) throw new Error("bad");
  const v=Function("sqrt","PI",'"use strict";return ('+s+');')(Math.sqrt,Math.PI);
  if(typeof v!=="number"||!isFinite(v)) throw new Error("bad");
  return Math.round(v*1e10)/1e10;
}
function calcKey(c){
  const inp=$("calcIn");
  if(c==="C"){ inp.value=""; $("calcRes").textContent=""; }
  else if(c==="⌫"){ inp.value=inp.value.slice(0,-1); }
  else if(c==="="){ try{ const v=calcEval(inp.value); $("calcRes").textContent=inp.value+" ="; inp.value=String(v); }catch(e){ $("calcRes").textContent="Error – check your brackets"; } }
  else if(c==="±"){ inp.value = inp.value.startsWith("−(")&&inp.value.endsWith(")") ? inp.value.slice(2,-1) : (inp.value?"−("+inp.value+")":"−"); }
  else if(c==="√"){ inp.value+="√("; }
  else inp.value+=c;
}
function toggleCalc(force){ const c=$("calc"); const show = force===undefined ? c.classList.contains("hidden") : force; c.classList.toggle("hidden",!show); if(show) $("calcIn").focus({preventScroll:true}); }

/* boot */
S=load(); buildCalc(); render(); ensureTick();
document.addEventListener("visibilitychange",tick);
</script>
</body>
</html>
