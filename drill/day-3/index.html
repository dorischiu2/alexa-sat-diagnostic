<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="drill-build" content="1501e3e40e">
<title>Alexa SAT drill – Day 3</title>
<style>

:root{--navy:#24416b;--navy2:#2f5d9a;--sky:#e9f1fb;--line:#d5dbe5;--ink:#1b2330;--muted:#5c6776;--good:#1f8a4c;--warn:#c0392b;--flag:#d97706;--bg:#f6f8fb}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
.serif{font-family:Georgia,"Noto Serif","Times New Roman",serif}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}
.btn{background:var(--navy2);color:#fff;border:0;border-radius:999px;padding:.6em 1.4em;font-weight:600;min-height:44px}
.btn:hover{background:var(--navy)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--navy2)}
.btn.big{font-size:1.15em;padding:.75em 2em}
.btn.warn{background:var(--warn)}
.btn:disabled{opacity:.45;cursor:default}
/* screens */
.screen{min-height:100%;display:flex;flex-direction:column}
.card{background:#fff;border-radius:18px;box-shadow:0 4px 24px rgba(20,40,80,.08);padding:28px 30px;max-width:760px;width:calc(100% - 28px);margin:28px auto}
.hero{text-align:center}
.hero .emoji{font-size:54px;line-height:1.15;margin-bottom:4px}
h1{font-size:1.8em;margin:.2em 0 .3em;color:var(--navy)}
h2{color:var(--navy);margin:.2em 0 .5em}
.kicker{letter-spacing:.18em;text-transform:uppercase;color:var(--navy2);font-size:.8em;font-weight:700}
.field{display:flex;gap:10px;align-items:center;justify-content:center;margin:16px 0}
.field input{font:inherit;padding:.5em .8em;border:2px solid var(--line);border-radius:10px;width:220px}
table.plan{border-collapse:collapse;margin:10px auto;font-size:.95em}
table.plan td,table.plan th{border-bottom:1px solid var(--line);padding:6px 14px;text-align:left}
ul.tips{padding-left:1.2em} ul.tips li{margin:.3em 0}
/* test layout */
header.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px}
header.bar .title{font-weight:700;color:var(--navy);font-size:.95em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{display:flex;flex-direction:column;align-items:center;min-width:92px}
.timer .t{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.3em;letter-spacing:.03em}
.timer .t.low{color:var(--warn)}
.timer button{background:none;border:1px solid var(--line);border-radius:999px;font-size:.72em;padding:0 .8em;color:var(--muted)}
.tools{flex:1;display:flex;justify-content:flex-end;gap:6px}
.tool{background:#fff;border:1px solid var(--line);border-radius:10px;padding:.35em .7em;font-size:.85em;color:var(--navy);min-height:40px}
.tool:hover{background:var(--sky)}
main.q{flex:1;display:flex;width:100%;max-width:1200px;margin:0 auto;padding:14px 14px 96px;gap:18px}
.pane{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;flex:1;min-width:0}
.pane.left{flex:1.1}
.qhead{display:flex;align-items:center;justify-content:space-between;background:#eef2f7;border-radius:8px;padding:4px 6px 4px 4px;margin-bottom:12px}
.qnum{background:var(--ink);color:#fff;font-weight:700;border-radius:6px;padding:2px 10px}
.flagbtn{background:none;border:0;color:var(--muted);font-size:.9em;padding:.3em .6em;border-radius:8px;min-height:36px}
.flagbtn.on{color:var(--flag);font-weight:700}
.flagbtn .ic{display:inline-block;width:14px;height:16px;vertical-align:-2px;margin-right:4px}
.passage{font-size:1.02em}
.stem{font-weight:600;margin:4px 0 12px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:12px;padding:10px 14px;margin:0 0 10px;min-height:52px;color:var(--ink)}
.choice:hover{border-color:var(--navy2)}
.choice .L{flex:0 0 32px;height:32px;border:2px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:system-ui,sans-serif}
.choice.sel{border-color:var(--navy2);background:var(--sky);box-shadow:0 0 0 2px var(--navy2) inset}
.choice.sel .L{background:var(--navy2);border-color:var(--navy2);color:#fff}
.fig{text-align:center;margin:6px 0 12px} .fig img{max-width:100%;width:440px;height:auto}
.shortt{display:none}
.fig.small img{width:360px}
ul.notes{margin:6px 0 10px;padding-left:1.3em} ul.notes li{margin:.25em 0}
.eq{margin:4px 0 10px 18px;font-size:1.08em;line-height:1.6}
.frac{display:inline-block;vertical-align:middle;text-align:center;font-size:.9em;line-height:1.15;margin:0 2px}
.frac .num{display:block;border-bottom:1px solid currentColor;padding:0 3px}.frac .den{display:block;padding:0 3px}
sup{font-size:.7em;line-height:0}
table.data{border-collapse:collapse;margin:8px auto 12px;font-size:.92em}
table.data th,table.data td{border:1px solid #777;padding:4px 12px;text-align:center}
table.data th{background:#eaf0f8} table.data caption{font-weight:700;margin-bottom:4px}
table.grid{border-collapse:collapse;width:100%;font-size:.9em}
table.grid th,table.grid td{border:1px solid #bbb;padding:6px 8px;vertical-align:top;text-align:left}
table.grid th{background:#eaf0f8}
.small{font-size:.88em;color:var(--muted)}
/* grid-in */
.spr{margin-top:10px}
.spr label{font-weight:600;display:block;margin-bottom:6px}
.spr input{font:inherit;font-size:1.4em;width:170px;padding:.3em .5em;border:2px solid var(--ink);border-radius:8px;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.spr .preview{margin-top:10px;font-size:1.1em}
.spr .err{color:var(--warn);font-size:.9em;margin-top:6px;min-height:1.2em}
.sprhelp{margin-top:16px;background:#f5f7fa;border-radius:10px;padding:10px 14px;font-size:.86em;color:var(--muted)}
.sprhelp ul{margin:4px 0;padding-left:1.2em}
/* footer */
footer.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
footer.nav .who{flex:1;font-weight:600;color:var(--muted);font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer.nav .mid{flex:0 0 auto}
footer.nav .right{flex:1;display:flex;justify-content:flex-end;gap:8px}
.navbtn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:.45em 1em;font-weight:600;min-height:40px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,25,45,.45);z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}
.modal .box{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .box h3{margin:0 0 10px;color:var(--navy)}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:8px;margin:12px 0}
.navgrid button{position:relative;height:46px;border:2px dashed #8a94a3;background:#fff;border-radius:8px;font-weight:700;color:var(--navy)}
.navgrid button.ans{border:2px solid var(--navy2);background:var(--navy2);color:#fff}
.navgrid button.cur{outline:3px solid var(--ink);outline-offset:2px}
.navgrid button.flg::after{content:"";position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--flag);border:2px solid #fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82em;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .a::before{background:var(--navy2)} .legend .u::before{border:2px dashed #8a94a3} .legend .f::before{background:var(--flag);border-radius:50%}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
/* calculator */
#calc{position:fixed;right:14px;bottom:78px;z-index:15;width:290px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:12px}
#calc .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--navy)}
#calc input{width:100%;font-size:1.25em;text-align:right;padding:.35em .5em;border:2px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
#calc .res{text-align:right;color:var(--muted);min-height:1.4em;font-size:.95em;margin:4px 2px}
#calc .keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
#calc .keys button{height:42px;border:1px solid var(--line);border-radius:8px;background:#f5f7fa;font-weight:600}
#calc .keys button.op{background:#e9f1fb;color:var(--navy)}
#calc .keys button.eq{background:var(--navy2);color:#fff;grid-column:span 2}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;z-index:30;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25)}
/* review & done */
.revgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px;margin:14px 0}
.revgrid button{height:52px;border:2px dashed #8a94a3;background:#fff;border-radius:8px;font-weight:700;color:var(--navy);position:relative}
.revgrid button.ans{border:2px solid var(--navy2);background:var(--navy2);color:#fff}
.revgrid button.flg::after{content:"";position:absolute;top:-6px;right:-6px;width:14px;height:14px;border-radius:50%;background:var(--flag);border:2px solid #fff}
.stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.stat{background:var(--sky);border-radius:12px;padding:10px 16px;text-align:center;min-width:140px}
.stat b{display:block;font-size:1.3em;color:var(--navy)}
.resp{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:8px 0 16px}
.resp div{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.9em;background:#fff}
.resp div b{color:var(--navy)} .resp div.blank{color:#9aa3af} .resp div.fl{border-color:var(--flag);background:#fff7ea}
.send{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:18px 0 8px}
.send a.btn{text-decoration:none;display:inline-flex;align-items:center}
textarea.code{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8em;border:1px solid var(--line);border-radius:8px;padding:8px;height:92px;resize:vertical}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:.85em}
@media (max-width:820px){
  main.q{flex-direction:column;padding:10px 10px 96px;gap:10px}
  .pane{padding:14px 14px}
  body{font-size:16px}
  .tool .lbl{display:none}
  header.bar .title{font-size:.85em}
  #calc{left:10px;right:10px;width:auto}
  footer.nav .who{display:none}
  header.bar .long{display:none} header.bar .shortt{display:inline}
  footer.nav{justify-content:space-between}
}
/* ---- drill additions ---- */
.timer .t.amber{color:var(--flag)} .timer .t.over{color:var(--warn)}
.banner{background:#fff4e0;border-bottom:2px solid var(--flag);color:#7a4a00;text-align:center;padding:8px 12px;font-weight:600}
.tipbox{background:#eef7ee;border:1px solid #bfe0c4;border-radius:12px;padding:10px 14px;margin:0 0 12px;font-size:.95em}
.tipbox b.k{color:var(--good)}
.hintbox{background:#fff7e6;border:1px solid #f3d29a;border-radius:12px;padding:10px 14px;margin:12px 0 0}
.hintbtn{margin-top:12px;background:#fff;border:2px dashed var(--flag);color:#8a5200;border-radius:999px;padding:.35em 1em;font-weight:600;min-height:40px}
.lvl{font-size:.75em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:2px 9px;margin-left:6px}
.lvl.warm{background:#e7f6ec;color:#1f7a44}.lvl.core{background:#e9f1fb;color:#2f5d9a}.lvl.stretch{background:#fbeaea;color:#a12b2b}
.skilltag{color:var(--muted);font-size:.85em}
.nudge{background:#fff7e6;border:1px solid #f3d29a;border-radius:12px;padding:10px 14px;margin:12px 0;text-align:left}
.rev{border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:12px 0;background:#fff}
.rev.ok{border-left:6px solid var(--good)} .rev.no{border-left:6px solid var(--warn)} .rev.blank{border-left:6px solid #9aa3af}
.rev .hd{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rev .mark{font-weight:800} .rev.ok .mark{color:var(--good)} .rev.no .mark,.rev.blank .mark{color:var(--warn)}
.rev .qtxt{font-size:.95em;margin:6px 0}
.rev .ansrow{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0;font-size:.95em}
.rev .expl{background:#f5f7fa;border-radius:10px;padding:8px 12px;font-size:.93em}
.rev .fig img{width:300px}
.chip{display:inline-block;background:#fff7e6;border:1px solid #f3d29a;border-radius:999px;font-size:.75em;padding:1px 8px;color:#8a5200;margin-left:6px}
.choice.right{border-color:var(--good);background:#eaf7ef} .choice.wrong{border-color:var(--warn);background:#fdeeee}
.mini .choice{min-height:40px;padding:6px 10px;margin-bottom:6px;font-size:.92em;cursor:default}
.mini .choice .L{flex-basis:26px;height:26px}
.levelup{background:linear-gradient(90deg,#fff3c4,#e7f6ec);border:2px solid #f0c94a;border-radius:14px;padding:10px 16px;margin:10px 0;text-align:center;font-size:1.05em}
.lvl.foundation{background:#f1ecfb;color:#5b3fa0}.lvl.hard{background:#2b2b2b;color:#ffd54a}
.topics{text-align:left;margin:8px auto;max-width:520px}
</style>
</head>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>

<script>
"use strict";

function tick(){
  if(S.phase!=="q") return;
  const left = LIMIT - elapsed(); const el=$("timeLeft");
  if(el){ el.textContent = left>=0 ? fmt(left) : "+"+fmt(-left); el.classList.toggle("amber", left<120 && left>=0); el.classList.toggle("over", left<0); }
  if(left<120 && left>0 && !warned2){ warned2=true; toast("2 minutes left – make sure every question has an answer!"); }
  const b=$("timesUp"); if(b) b.classList.toggle("hidden", left>0);
}

function sprValid(v){
  if(!v) return {ok:true};
  if(v.length > (v[0]==="-"?6:5)) return {ok:false,msg:"Too many characters (max 5, or 6 with a minus sign)."};
  if(!/^-?(\d+\.?\d*|\.\d+|\d+\/\d+)$/.test(v)) return {ok:false,msg:"Use a number like 12, 3.5, .75, 7/2 or -4."};
  if(/\/0+$/.test(v)) return {ok:false,msg:"You can't divide by zero."};
  return {ok:true};
}
function sprInput(e){
  const inp=e.target; let v=inp.value.replace(/[−–—]/g,"-").replace(/\s+/g,"").replace(/[^0-9.\/\-]/g,"");

}

/* ---------- marking ---------- */
function num(v){ v=String(v).trim(); const m=v.match(/^(-?\d+)\/(\d+)$/); if(m) return Number(m[1])/Number(m[2]); return v===""?NaN:Number(v); }
function isCorrect(q, a){
  if(!a) return false;
  if(q.type==="mc") return a===q.answer;
  const u=num(a); if(!isFinite(u)) return false;
  return q.answer.some(acc=>{ const v=num(acc); if(Math.abs(u-v)<1e-9) return true;
    const isDec=/\./.test(a) && a.replace("-","").length>=5; return isDec && Math.abs(u-v)<0.001; });
}
function correctText(q){ return q.type==="mc" ? q.answer : q.answer[0]; }
function submit(){
  S.finishedAt=Date.now(); S.elapsedSec=Math.round(elapsed());
  let score=0, nc=0;
  const items=ITEMS.map(q=>{ const a=S.ans[q.id]||""; const ok=isCorrect(q,a); const h=!!S.hints[q.id];
    if(ok){ nc++; score+= h?1:2; }
    return {id:q.id, skill:q.skillCode, level:q.level, correct:ok, hintUsed:h, userAnswer:a, answer:correctText(q)}; });
  const d=new Date(S.finishedAt); const ds=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  S.results={date:ds, day:DAY, score:score, maxScore:2*N, correctCount:nc, total:N, answered:N-blanks().length,
    timeLimitSec:LIMIT, elapsedSec:S.elapsedSec, overTime:S.elapsedSec>LIMIT, items:items};
  S.levelUps=computeLevelUps(items, S.elapsedSec);
  S.phase="done"; toggleCalc(false); save(); render();
}
/* mirror of drill_lib.ramp_update (progress.json is updated for real when Mum ingests the results) */
function computeLevelUps(items, el){
  const LV=DATA.levels||[], R=DATA.ramp||{promote:2,fastSec:600}; const st=JSON.parse(JSON.stringify(DATA.skillState||{}));
  const ups=[], promoted={};
  items.forEach(i=>{ const s=st[i.skill]; if(!s) return; const cur=LV.indexOf(s.level), il=LV.indexOf(i.level);
    if(i.correct && !i.hintUsed){ if(il>=cur){ s.streak=(s.streak||0)+1; if(s.streak>=R.promote && cur<LV.length-1){ ups.push({skill:i.skill,from:s.level,to:LV[cur+1],why:"2 right in a row"}); s.level=LV[cur+1]; s.streak=0; promoted[i.skill]=1; } } }
    else s.streak=0; });
  if(items.length && items.every(i=>i.correct&&!i.hintUsed) && el<=R.fastSec){
    [...new Set(items.map(i=>i.skill))].forEach(c=>{ const s=st[c]; if(!s||promoted[c]) return; const cur=LV.indexOf(s.level);
      if(cur<LV.length-1){ ups.push({skill:c,from:s.level,to:LV[cur+1],why:"fast perfect day"}); s.level=LV[cur+1]; } }); }
  return ups;
}
function humanSummary(){
  const r=S.results; const hints=r.items.filter(i=>i.hintUsed).length;
  const missed=[...new Set(r.items.filter(i=>!i.correct).map(i=>SKILLNAME[i.skill]))];
  return `Hi Mum and Francois,\n\nI finished SAT drill Day ${DAY}!\nScore: ${r.correctCount}/${r.total} correct (${r.score}/${r.maxScore} points), time ${fmt(r.elapsedSec)}, hints ${hints}.\n`+
    (missed.length?`To practise: ${missed.join(", ")}.\n`:"All correct!\n");
}
function resultsBlock(level){
  // level 0 = full; 1 = drop skill/level (re-filled from bank.json on ingest); 2 = also drop answer
  const r=S.results;
  const items=r.items.map(i=>{ const o={id:i.id}; if(level<1){ o.skill=i.skill; o.level=i.level; }
    o.correct=i.correct; o.hintUsed=i.hintUsed; o.userAnswer=i.userAnswer; if(level<2) o.answer=i.answer; return o; });
  const o={date:r.date, day:r.day, score:r.score, maxScore:r.maxScore, correctCount:r.correctCount, total:r.total, elapsedSec:r.elapsedSec, items:items};
  return "RESULTS_JSON_START\n"+JSON.stringify(o)+"\nRESULTS_JSON_END";
}
function enc(s){ return encodeURIComponent(s).replace(/%2C/g,",").replace(/%3A/g,":").replace(/%40/g,"@").replace(/%2F/g,"/"); }
function mailtoHref(){
  for(let lv=0; lv<3; lv++){
    const body=humanSummary()+"\n"+resultsBlock(lv)+"\n\nLove, Alexa";
    const href="mailto:"+EMAILS+"?subject="+enc(SUBJECT)+"&body="+enc(body);
    if(href.length<=1800 || lv===2) return href;
  }
}
function copyText(){ return humanSummary()+"\n"+resultsBlock(0)+"\n\nLove, Alexa"; }
function doneHTML(){
  const r=S.results; const pct=Math.round(100*r.correctCount/r.total);
  const emoji = pct>=80?"🏆":pct>=50?"🌟":"💪";
  const cards=ITEMS.map((q,i)=>{ const it=r.items[i]; const a=it.userAnswer;
    const cls = it.correct?"ok":(a?"no":"blank"); const mark = it.correct?"✓ Correct":(a?"✗ Not quite":"– Blank");
    let body = "";
    if(q.table) body+=q.table;
    if(q.img) body+=`<div class="fig"><img src="${q.img}" alt="figure"></div>`;
    body+=`<div class="qtxt serif">${q.question}</div>`;
    if(q.notes) body+=`<ul class="notes serif">${q.notes.map(x=>`<li>${x}</li>`).join("")}</ul>`;
    if(q.stem) body+=`<div class="stem serif">${q.stem}</div>`;
    if(q.type==="mc") body+=`<div class="mini">${choicesHTML(q,true)}</div>`;
    else body+=`<div class="ansrow"><span>Your answer: <b>${a?esc(a.replace("-","−")):"(blank)"}</b></span><span>Correct answer: <b>${esc(q.answer[0].replace("-","−"))}</b>${q.answer.length>1?` <span class="small">(also accepted: ${esc(q.answer.slice(1).join(", "))})</span>`:""}</span></div>`;
    if(q.type==="mc") body+=`<div class="ansrow"><span>Your answer: <b>${a||"(blank)"}</b></span><span>Correct answer: <b>${q.answer}</b></span></div>`;
    body+=`<div class="expl"><b>Why:</b> ${q.explanation}</div>`;
    return `<div class="rev ${cls}" id="rev${i+1}"><div class="hd"><span><span class="qnum">${i+1}</span> <span class="mark">${mark}</span>${it.hintUsed?'<span class="chip">hint used</span>':""}</span><span class="skilltag">${esc(SKILLNAME[q.skillCode])} · ${q.level}</span></div>${body}</div>`; }).join("");
  const bl=r.items.filter(i=>!i.userAnswer).length;
  return `<div class="screen"><div class="card"><div class="hero"><div class="emoji">${emoji}</div><div class="kicker">Day ${DAY} complete</div>
  <h1 id="scoreLine">${r.correctCount} / ${r.total} correct</h1>
  <div class="stats"><div class="stat">Points<b id="points">${r.score} / ${r.maxScore}</b>2 = right, 1 = right with hint</div>
  <div class="stat">Time<b>${fmt(r.elapsedSec)}</b>${r.overTime?"over 15:00 – keep practising speed":"within 15:00 ✓"}</div>
  <div class="stat">Blanks<b>${bl}</b>${bl?"remember: always guess!":"no blanks – great habit!"}</div></div></div>
  ${(S.levelUps&&S.levelUps.length)?`<div class="levelup" id="levelUp"><b>🎉 Level up!</b> ${S.levelUps.map(u=>`${esc(SKILLNAME[u.skill])}: ${u.from} → <b>${u.to}</b>`).join(" · ")}<div class="small">Tomorrow's questions on ${S.levelUps.length>1?"these topics":"this topic"} will be a step harder.</div></div>`:""}
  <div class="send"><a class="btn big" id="mailBtn" href="#">📧 Send my results to Mum</a><button class="btn ghost big" id="copyBtn">📋 Copy results</button></div>
  <p class="small" style="text-align:center">If the email button doesn't open an email app, press <b>Copy results</b> and paste them into a message to Mum.</p>
  <h2 style="margin-top:22px">Answers &amp; explanations</h2>
  ${cards}
  <label class="small" for="codeBox">Results code (for Mum):</label><textarea class="code" id="codeBox" readonly>${esc(resultsBlock(0))}</textarea>
  <div style="text-align:center;margin-top:18px"><button class="link" id="resetBtn">Start Day ${DAY} again</button></div></div></div>`;
}
function bindDone(){
  $("mailBtn").setAttribute("href", mailtoHref());
  $("copyBtn").onclick=async()=>{ const txt=copyText(); let ok=false;
    try{ await navigator.clipboard.writeText(txt); ok=true; }catch(e){}
    if(!ok){ const ta=$("codeBox"); ta.value=txt; ta.focus(); ta.select(); try{ ok=document.execCommand("copy"); }catch(e){} }
    toast(ok?"Results copied! Paste them into a message to Mum.":"Select the results code below and copy it."); };
  $("resetBtn").onclick=()=>{ openModal(`<h3>Start again?</h3><p>This deletes today's answers on this device. Only do this after Mum has your results.</p><div class="row"><button class="btn ghost" onclick="closeModal()">Keep them</button><button class="btn warn" id="mReset">Delete and restart</button></div>`);
    $("mReset").onclick=()=>{ closeModal(); S=fresh(); save(); render(); }; };
}

/* ---------- calculator (same as the diagnostic) ---------- */
const CK=[["7","8","9","÷","("],["4","5","6","×",")"],["1","2","3","−","^"],["0",".","π","+","√"],["C","⌫","±","="]];
function buildCalc(){
  const k=$("calcKeys"); k.innerHTML="";
  CK.flat().forEach(c=>{ const b=document.createElement("button"); b.textContent=c; b.type="button";
    if("÷×−+^√()π±".includes(c)) b.className="op"; if(c==="=") b.className="eq"; b.onclick=()=>calcKey(c); k.appendChild(b); });
  $("calcIn").addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); calcKey("="); } });
}
function calcEval(src){
  let s=src.replace(/×/g,"*").replace(/÷/g,"/").replace(/[−–]/g,"-").replace(/π/g,"PI").replace(/√/g,"sqrt").replace(/\^/g,"**").replace(/\s+/g,"");
  s=s.replace(/(\d|\)|PI)(?=\(|PI|sqrt)/g,"$1*"); s=s.replace(/sqrt(\d+(?:\.\d+)?|PI)/g,"sqrt($1)");
  if(!/^[0-9.+\-*/()]*$/.test(s.replace(/sqrt|PI/g,""))) throw new Error("bad");
  const v=Function("sqrt","PI",'"use strict";return ('+s+');')(Math.sqrt,Math.PI);
  if(typeof v!=="number"||!isFinite(v)) throw new Error("bad"); return Math.round(v*1e10)/1e10;
}
function calcKey(c){
  const inp=$("calcIn");
  if(c==="C"){ inp.value=""; $("calcRes").textContent=""; }
  else if(c==="⌫"){ inp.value=inp.value.slice(0,-1); }
  else if(c==="="){ try{ const v=calcEval(inp.value); $("calcRes").textContent=inp.value+" ="; inp.value=String(v); }catch(e){ $("calcRes").textContent="Error – check your brackets"; } }
  else if(c==="±"){ inp.value = inp.value.startsWith("−(")&&inp.value.endsWith(")") ? inp.value.slice(2,-1) : (inp.value?"−("+inp.value+")":"−"); }
  else if(c==="√"){ inp.value+="√("; } else inp.value+=c;
}
function toggleCalc(force){ const c=$("calc"); const show = force===undefined ? c.classList.contains("hidden") : force; c.classList.toggle("hidden",!show); if(show) $("calcIn").focus({preventScroll:true}); }

S=load(); buildCalc(); render(); ensureTick();
document.addEventListener("visibilitychange",tick);
window.__drill={get S(){return S;}, mailtoHref, copyText, ITEMS};
</script>
